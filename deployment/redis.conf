# Redis 7+ for OfferPath. Start from a private, persistent data directory:
# redis-server /absolute/path/to/mail-check/deployment/redis.conf
# A relative dir deliberately uses that working directory, not the checkout.
bind 127.0.0.1
protected-mode yes
port 6379
dir .
daemonize no
appendonly yes
appendfsync always
save ""
maxmemory 256mb
maxmemory-policy noeviction
