pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s ipv6=off;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;
  server {
    listen 8080;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    set $core core:8000;
    set $mail mail:8000;
    set $intelligence intelligence:8000;
    location = /platform/live { return 204; }
    location = /platform/core/live { proxy_pass http://$core/health/live; }
    location = /platform/core/dependencies { proxy_pass http://$core/health/dependencies; }
    location = /platform/mail/dependencies { proxy_pass http://$mail/health/dependencies; }
    location = /platform/intelligence/dependencies { proxy_pass http://$intelligence/health/dependencies; }
    location / { return 503 '{"code":"migration_not_ready","phase":"foundation","business_ready":false,"message":"Continue using the existing OfferPath deployment."}'; }
  }
}
