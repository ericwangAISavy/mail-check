name: Service foundation
on:
  pull_request:
    paths: ['mailcheck/services/**', 'deployment/microservices/**', 'tests/test_service*', '.github/workflows/service-foundation.yml', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: offerpath-foundation-ci
      COMPOSE_FILE: deployment/microservices/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,services]'
      - run: |
          echo "OFFERPATH_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "OFFERPATH_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"
          python -m mailcheck.services.manage init
      - run: python -m pytest tests/test_service_foundation.py tests/test_service_bootstrap.py tests/test_service_smoke.py tests/test_service_deployment.py -q
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          docker compose --profile tools run --rm verify
          python -m mailcheck.services.verify_stack
      - if: always()
        run: docker compose down --volumes
