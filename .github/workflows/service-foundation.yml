name: Service foundation
on:
  pull_request:
    paths: ['mailcheck/services/**', 'deployment/microservices/**', 'tests/test_service*', 'tools/microservices.ps1', '.github/workflows/service-foundation.yml', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: offerpath-foundation-ci
      COMPOSE_FILE: deployment/microservices/compose.yaml:deployment/microservices/compose.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,services]'
      - run: |
          echo "OFFERPATH_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "OFFERPATH_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"
          python -m mailcheck.services.manage init
      - run: python -m pytest tests/test_service*.py -q
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          docker compose --profile tools run --rm verify
          python -m mailcheck.services.verify_stack
      - name: Verify real database and broker contracts
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          state = Path('deployment/microservices/.local').resolve()
          config = state / 'test-stack.json'
          config.write_text(json.dumps({'host': '127.0.0.1', 'postgres_port': 55432, 'broker_port': 55672, 'secrets': str(state / 'secrets')}))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'OFFERPATH_TEST_STACK={config}\n')
          PYTHON
      - run: python -m pytest tests/test_service*.py -q
      - if: always()
        run: docker compose down --volumes

  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mail check smoke
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: mail check smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize and validate an empty scaffold with a spaced repository path
        run: |
          New-Item -ItemType Directory -Force deployment/microservices/.local | Out-Null
          ./tools/microservices.ps1 Init
          $before = (Get-FileHash deployment/microservices/.local/manifest.json).Hash
          ./tools/microservices.ps1 Init
          $after = (Get-FileHash deployment/microservices/.local/manifest.json).Hash
          if ($before -ne $after) { throw 'Reinitialization changed existing service state.' }
      - name: Preserve populated state and report a specific recovery error
        run: |
          $manifest = 'deployment/microservices/.local/manifest.json'
          Move-Item $manifest "$manifest.backup"
          try {
            try {
              ./tools/microservices.ps1 Init
              throw 'Expected initialization to reject missing manifest.'
            } catch {
              if ($_.Exception.Message -notmatch 'state_manifest_missing') { throw }
            }
          } finally { Move-Item "$manifest.backup" $manifest }
          ./tools/microservices.ps1 Init
